name: Publish

on:
  workflow_dispatch:
  push:
    branches: [ '**/main' ]
    paths: [ '**/src/**' ]

jobs:
  publish-mod:
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-mod.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      publish-task: ':publishReleasePublicationToApexStudios-ReleasesRepository'
      curseforge-id: '1194521'
      modrinth-id: 'M29GVxmz'
      artifact-id: apexcompatibilities
      display-name: ApexCompatibilities
      release-type: release
      logo-url: 'https://raw.githubusercontent.com/ApexStudios-Dev/.github/refs/heads/master/assets/minecraft/apexcompatibilities/logo.png'
      color: 0x3358FA
