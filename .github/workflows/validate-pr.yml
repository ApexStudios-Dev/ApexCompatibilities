name: Test PR

on:
  pull_request:
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened

jobs:
  generate-vars:
    name: Generate Vars
    uses: ApexStudios-Dev/.github/.github/workflows/_generate-vars.yml@master
    secrets: inherit

  build:
    name: Build
    needs: generate-vars
    if: success()
    uses: ApexStudios-Dev/.github/.github/workflows/_build.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}

  check-local-changes:
    name: Check local changes
    needs: generate-vars
    if: success()
    uses: ApexStudios-Dev/.github/.github/workflows/_check-local-changes.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}

  publish-maven:
    name: Publish Maven
    needs: [ generate-vars, build, check-local-changes ]
    if: success()
    uses: ApexStudios-Dev/.github/.github/workflows/_publish-maven.yml@master
    secrets: inherit
    with:
      java-version: 21
      java-vendor: temurin
      version: ${{ needs.generate-vars.outputs.version }}
      publish-task: ':publishReleasePublicationToApexStudios-PrivateRepository'

  test:
    name: Test Production
    runs-on: ubuntu-latest
    needs: [ generate-vars, publish-maven ]
    if: success()
    steps:
      - name: Prepare Environment
        run: |
          mkdir mods
          wget -O "mods/apexcore-$APEXCORE_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/apexcore/$APEXCORE_VERSION/apexcore-$APEXCORE_VERSION.jar"
          wget -O "mods/itemresistance-$ITEMRESISTANCE_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/itemresistance/$ITEMRESISTANCE_VERSION/itemresistance-$ITEMRESISTANCE_VERSION.jar"
          wget -O "mods/infusedfoods-$INFUSEDFOODS_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/infusedfoods/$INFUSEDFOODS_VERSION/infusedfoods-$INFUSEDFOODS_VERSION.jar"
          wget -O "mods/fantasydice-$FANTASYDICE_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasydice/$FANTASYDICE_VERSION/fantasydice-$FANTASYDICE_VERSION.jar"
          wget -O "mods/fantasyfurniture-$FANTASYFURNITURE_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture/$FANTASYFURNITURE_VERSION/fantasyfurniture-$FANTASYFURNITURE_VERSION.jar"
          wget -O "mods/fantasyfurniture-nordic-$FANTASYFURNITURE_NORDIC_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-nordic/$FANTASYFURNITURE_NORDIC_VERSION/fantasyfurniture-nordic-$FANTASYFURNITURE_NORDIC_VERSION.jar"
          wget -O "mods/fantasyfurniture-venthyr-$FANTASYFURNITURE_VENTHYR_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-venthyr/$FANTASYFURNITURE_VENTHYR_VERSION/fantasyfurniture-venthyr-$FANTASYFURNITURE_VENTHYR_VERSION.jar"
          wget -O "mods/fantasyfurniture-bone-$FANTASYFURNITURE_BONE_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-bone/$FANTASYFURNITURE_BONE_VERSION/fantasyfurniture-bone-$FANTASYFURNITURE_BONE_VERSION.jar"
          wget -O "mods/fantasyfurniture-dunmer-$FANTASYFURNITURE_DUNMER_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-dunmer/$FANTASYFURNITURE_DUNMER_VERSION/fantasyfurniture-dunmer-$FANTASYFURNITURE_DUNMER_VERSION.jar"
          wget -O "mods/fantasyfurniture-necrolord-$FANTASYFURNITURE_NECROLORD_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-necrolord/$FANTASYFURNITURE_NECROLORD_VERSION/fantasyfurniture-necrolord-$FANTASYFURNITURE_NECROLORD_VERSION.jar"
          wget -O "mods/fantasyfurniture-royal-$FANTASYFURNITURE_ROYAL_VERSION.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/fantasyfurniture-royal/$FANTASYFURNITURE_ROYAL_VERSION/fantasyfurniture-royal-$FANTASYFURNITURE_ROYAL_VERSION.jar"
          wget -O "mods/apexcompatibilities-${{ needs.generate-vars.outputs.version }}.jar" "https://maven.apexstudios.dev/private/dev/apexstudios/apexcompatibilities/${{ needs.generate-vars.outputs.version }}/apexcompatibilities-${{ needs.generate-vars.outputs.version }}.jar"
          wget -O "mods/jade-$JADE_VERSION+neoforge.jar" "https://api.modrinth.com/maven/maven/modrinth/jade/$JADE_VERSION+neoforge/jade-$JADE_VERSION+neoforge.jar"
          wget -O "mods/architectury-neoforge-$ARCHITECTURY_VERSION.jar" "https://maven.architectury.dev/dev/architectury/architectury-neoforge/$ARCHITECTURY_VERSION/architectury-neoforge-$ARCHITECTURY_VERSION.jar"
          wget -O "mods/cloth-config-neoforge-$CLOTHCONFIG_VERSION-neoforge.jar" "https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-neoforge/$CLOTHCONFIG_VERSION/cloth-config-neoforge-$CLOTHCONFIG_VERSION-neoforge.jar"
          wget -O "mods/RoughlyEnoughItems-neoforge-$REI_VERSION.jar" "https://maven.shedaniel.me/me/shedaniel/RoughlyEnoughItems-neoforge/$REI_VERSION/RoughlyEnoughItems-neoforge-$REI_VERSION.jar"
          wget -O "mods/jei-1.21.5-neoforge-$JEI_VERSION.jar" "https://maven.blamejared.com/mezz/jei/jei-1.21.5-neoforge/$JEI_VERSION/jei-1.21.5-neoforge-$JEI_VERSION.jar"
        env:
          APEXCORE_VERSION: 21.5.3
          ITEMRESISTANCE_VERSION: 21.5.1
          INFUSEDFOODS_VERSION: 21.5.1
          FANTASYDICE_VERSION: 21.5.1
          FANTASYFURNITURE_VERSION: 21.5.1
          FANTASYFURNITURE_NORDIC_VERSION: 21.5.1
          FANTASYFURNITURE_VENTHYR_VERSION: 21.5.1
          FANTASYFURNITURE_BONE_VERSION: 21.5.1
          FANTASYFURNITURE_DUNMER_VERSION: 21.5.1
          FANTASYFURNITURE_NECROLORD_VERSION: 21.5.1
          FANTASYFURNITURE_ROYAL_VERSION: 21.5.1
          ARCHITECTURY_VERSION: 16.1.4
          REI_VERSION: 19.0.806
          CLOTHCONFIG_VERSION: 18.0.145
          JEI_VERSION: 21.0.0.2
          JADE_VERSION: 18.2.0

      - name: Test Production Server
        uses: ApexStudios-Dev/.github/actions/test-production-server@master
        with:
          java-version: 21
          java-vendor: temurin
          neoforge-version: 21.5.34-beta
